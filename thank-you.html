  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #D4A017;

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:

      radial-gradient(ellipse 60% 40% at 50% 100%, rgba(212,160,23,0.06) 0%, transparent 70%);

  .card {
    background: linear-gradient(135deg, #0D1F0F, #1A3A1C);
    border: 1px solid rgba(46,204,113,0.4);
    border-radius: 1.5rem;
    padding: 3rem 2rem;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 80px rgba(46,204,113,0.15), 0 20px 60px rgba(0,0,0,0.5);
    position: relative;
    animation: fadeUp 0.6s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .tick {
    font-size: 5rem;
    margin-bottom: 1.2rem;
    display: block;
    animation: tickBounce 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.3s both;
  }

  @keyframes tickBounce {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.3); }
    100% { transform: scale(1); opacity: 1; }
  }

  h1 {
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    font-weight: 900;
    color: var(--green-light);
    margin-bottom: 0.5rem;
    line-height: 1.2;
  }

  .subtitle {
    font-size: 1rem;
    color: #A8F0C6;
    line-height: 1.75;
    margin-bottom: 0.5rem;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(46,204,113,0.3), transparent);
    margin: 1.8rem 0;
  }

  .instruction {
    font-size: 0.9rem;
    color: var(--text-muted);
    margin-bottom: 1.5rem;
    line-height: 1.7;
  }

  .whatsapp-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.7rem;
    background: #25D366;
    color: #fff;
    font-family: 'Anek Kannada', sans-serif;
    font-size: 1.15rem;
    font-weight: 900;
    padding: 1.1rem 2.5rem;
    border-radius: 3rem;
    text-decoration: none;
    width: 100%;
    box-shadow: 0 4px 25px rgba(37,211,102,0.45);
    transition: transform 0.2s, box-shadow 0.2s;
    animation: btnPulse 2.5s ease-in-out infinite;
  }

  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 4px 25px rgba(37,211,102,0.45); }
    50% { box-shadow: 0 4px 40px rgba(37,211,102,0.7), 0 0 60px rgba(37,211,102,0.2); }
  }

  .whatsapp-btn:hover { transform: translateY(-3px) scale(1.02); }

  .note {
    font-size: 0.78rem;
    color: rgba(168,240,198,0.5);
    margin-top: 1.2rem;
  }

  .payment-id {
    font-size: 0.72rem;

  .back-link {

    text-decoration: none;
    opacity: 0.6;

  @media (max-width: 480px) {
    .card { padding: 2rem 1.2rem; }
    h1 { font-size: 1.7rem; }
    .whatsapp-btn { font-size: 1rem; padding: 1rem 2rem; }
  }
